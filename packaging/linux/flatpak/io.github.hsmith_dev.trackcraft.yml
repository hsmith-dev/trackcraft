# Flatpak manifest for TrackCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.hsmith_dev.trackcraft.yml
#   flatpak run io.github.hsmith_dev.trackcraft
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The release's .flatpak bundles come from io.github.hsmith_dev.trackcraft.bundle.yml instead (see
# there); keep runtime, runtime-version, sdk and finish-args identical in both (packaging-lint
# checks this).
id: io.github.hsmith_dev.trackcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: trackcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend), so picked
  # .track files work anywhere without broad filesystem access. Documents is granted so files
  # passed by path (the command line, Open Recent) work in the usual place.
  - --filesystem=xdg-documents
  # Network: remote mode syncs with a TrackCraft team server; the optional --control server's
  # 127.0.0.1 listener is reachable from the host through the shared network namespace.
  - --share=network
  # Deliberately not granted: home/host filesystem access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: trackcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/trackcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p trackcraft -p trackcraft-cli
      - install -Dm755 target/release/trackcraft /app/bin/trackcraft
      - install -Dm755 target/release/trackcraft-cli /app/bin/trackcraft-cli
      - install -Dm644 NOTICE /app/share/doc/trackcraft/NOTICE
      - install -Dm644 ATTRIBUTION.md /app/share/doc/trackcraft/ATTRIBUTION.md
      - install -Dm644 packaging/linux/io.github.hsmith_dev.trackcraft.desktop /app/share/applications/io.github.hsmith_dev.trackcraft.desktop
      - install -Dm644 packaging/linux/io.github.hsmith_dev.trackcraft.mime.xml /app/share/mime/packages/io.github.hsmith_dev.trackcraft.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.hsmith_dev.trackcraft.metainfo.xml.in > /app/share/metainfo/io.github.hsmith_dev.trackcraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
