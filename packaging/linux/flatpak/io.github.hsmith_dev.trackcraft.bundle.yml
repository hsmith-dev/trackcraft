# Flatpak manifest for the single-file bundle attached to every GitHub release
# (trackcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (trackcraft-<version>-linux-<arch>.tar.gz, built
# on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no network and
# no vendored crate sources during the build, and byte-for-byte the same binaries as the
# AppImage/deb/rpm. The script unpacks the tarball into `stage/` next to a copy of this file. The
# binaries need glibc >= 2.35 and load X11, Wayland, xkbcommon and Vulkan at runtime; the
# freedesktop runtime has all of them, and the GPU driver comes from org.freedesktop.Platform.GL.
#
# io.github.hsmith_dev.trackcraft.yml (same directory) is the from-source manifest for Flathub.
# Keep runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: io.github.hsmith_dev.trackcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: trackcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend), so picked
  # .track files work anywhere without broad filesystem access. Documents is granted so files
  # passed by path (the command line, Open Recent) work in the usual place.
  - --filesystem=xdg-documents
  # Network: remote mode syncs with a TrackCraft team server; the optional --control server's
  # 127.0.0.1 listener is reachable from the host through the shared network namespace.
  - --share=network
  # Deliberately not granted: home/host filesystem access.
build-options:
  no-debuginfo: true
modules:
  - name: trackcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/trackcraft /app/bin/trackcraft
      - install -Dm755 bin/trackcraft-cli /app/bin/trackcraft-cli
      - install -Dm644 share/applications/io.github.hsmith_dev.trackcraft.desktop /app/share/applications/io.github.hsmith_dev.trackcraft.desktop
      - install -Dm644 share/mime/packages/io.github.hsmith_dev.trackcraft.xml /app/share/mime/packages/io.github.hsmith_dev.trackcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.hsmith_dev.trackcraft.metainfo.xml /app/share/metainfo/io.github.hsmith_dev.trackcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/trackcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
