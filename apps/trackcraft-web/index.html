<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>TrackCraft</title>
  <!-- Trunk builds the crate and injects the wasm-bindgen generated loader here: no handwritten JS. -->
  <link data-trunk rel="rust" data-bin="trackcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f5f7; }
    #trackcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #trackcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="trackcraft_canvas"></canvas>
  <div id="trackcraft_loading">Loading TrackCraft&hellip;</div>
</body>
</html>
