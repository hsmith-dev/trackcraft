[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/trackcraft", "apps/trackcraft-cli", "apps/trackcraft-server", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/hsmith-dev/trackcraft"

[workspace.dependencies]
# internal
trackcraft-core = { path = "crates/core" }
trackcraft-markup = { path = "crates/markup" }
trackcraft-jql = { path = "crates/jql" }
trackcraft-model = { path = "crates/model" }
trackcraft-store = { path = "crates/store" }
trackcraft-engine = { path = "crates/engine" }
trackcraft-mcp = { path = "crates/mcp" }
trackcraft-api = { path = "crates/api" }
trackcraft-server-lib = { path = "crates/server" }
trackcraft-import = { path = "crates/import" }
trackcraft-sync-proto = { path = "crates/sync-proto" }
trackcraft-sync-client = { path = "crates/sync-client" }
trackcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# All date/time conversion goes through chrono (AGENTS.md: no hand-rolled calendar code).
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# A wall clock that works on native and in the browser.
web-time = "1.1"

# server (L5+ only; `cargo xtask layers` keeps these out of lower layers). Minimal features keep
# build time down: HTTP/1 only, no tracing, no form/multipart. All MIT or MIT/Apache-2.0.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
# Streams for the sync endpoint's Server-Sent Events (axum's Sse takes a Stream). Already in the lock
# through axum; MIT OR Apache-2.0.
futures-util = { version = "0.3", default-features = false }
# imports (crates/import): reading Confluence export .zip files. zip is MIT; deflate only,
# through flate2 (MIT OR Apache-2.0) on its pure-Rust miniz_oxide backend (MIT OR Zlib OR Apache-2.0).
zip = { version = "3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# ui — the suite's egui fork (same pins as the sibling apps; see [patch.crates-io])
egui = "0.37"
eframe = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# The suite's egui and winit forks, as in the sibling apps.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
